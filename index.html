 os dados",subtitle:"Consultar e cuidar",color:"orange"},{id:5,title:"Dar o pr\xF3ximo passo",subtitle:"Views e rotinas",color:"rose"}],xa=[{id:"dados-e-banco",level:1,title:"O que \xE9 um banco de dados?",summary:"Conhe\xE7a a diferen\xE7a entre informa\xE7\xE3o, tabela e banco de dados.",minutes:5,steps:[{title:"Comece por algo conhecido",body:"Pense na lista de alunos de uma turma. Cada linha representa uma pessoa; cada coluna guarda uma informa\xE7\xE3o, como nome ou e-mail."},{title:"Junte informa\xE7\xF5es relacionadas",body:"Um banco de dados organiza v\xE1rias tabelas que precisam conversar entre si. Em uma escola, por exemplo, alunos, turmas e matr\xEDculas fazem parte do mesmo conjunto."},{title:"Duas ferramentas, dois pap\xE9is",body:"O MySQL Server guarda os dados e responde aos pedidos. O MySQL Workbench \xE9 a ferramenta visual que ajuda voc\xEA a se conectar, desenhar e enviar comandos ao servidor.",note:"A interface pode variar um pouco entre vers\xF5es. O conceito continua o mesmo."}],exercise:{kind:"choice",prompt:"Qual ferramenta guarda e administra os dados?",choices:["MySQL Server","MySQL Workbench","O arquivo de imagem do diagrama"],answer:"MySQL Server",feedback:"Isso mesmo. O Server \xE9 quem armazena e processa os dados.",hint:"Procure a pe\xE7a que funciona mesmo quando o Workbench est\xE1 fechado."}},{id:"entidades-atributos",level:1,title:"Transformar ideias em tabelas",summary:"Descubra entidades e atributos sem precisar decorar palavras dif\xEDceis.",minutes:6,image:"eer",steps:[{title:"Encontre as coisas importantes",body:"Uma entidade \xE9 algo sobre o qual queremos guardar informa\xE7\xF5es. Numa escola, \u201Caluno\u201D e \u201Ccurso\u201D s\xE3o entidades."},{title:"Liste o que queremos saber",body:"Os atributos descrevem uma entidade. Um aluno pode ter nome, e-mail e data de nascimento. Cada atributo vira uma coluna."},{title:"Olhe o desenho do Workbench",body:"No diagrama EER, cada caixa representa uma tabela. Dentro dela aparecem as colunas e seus tipos. O desenho ajuda a revisar o plano antes de construir o banco.",note:"EER quer dizer diagrama Entidade-Relacionamento Aprimorado. O manual oficial apresenta esse editor visual."}],exercise:{kind:"choice",prompt:"Na tabela \u201Calunos\u201D, o campo \u201Ce-mail\u201D \xE9...",choices:["Um atributo (coluna)","Um relacionamento","Um banco separado"],answer:"Um atributo (coluna)",feedback:"Exato. \u201CE-mail\u201D descreve cada aluno, ent\xE3o \xE9 um atributo.",hint:"A entidade \xE9 a \u201Ccoisa\u201D; o atributo descreve essa coisa."}},{id:"relacionamentos",level:1,title:"Ligar tabelas sem repetir tudo",summary:"Entenda relacionamentos e cardinalidade usando exemplos cotidianos.",minutes:7,image:"eer",steps:[{title:"Observe a vida real",body:"Uma turma pode ter muitos alunos, e cada aluno pode participar de v\xE1rias turmas em momentos diferentes. O banco precisa representar essas liga\xE7\xF5es."},{title:"Leia a cardinalidade",body:"Cardinalidade descreve quantas ocorr\xEAncias podem se ligar: uma para uma, uma para muitas ou muitas para muitas."},{title:"Use uma tabela de liga\xE7\xE3o",body:"Uma rela\xE7\xE3o muitos-para-muitos costuma virar uma tabela intermedi\xE1ria. \u201Cmatriculas\u201D pode ligar alunos a turmas e ainda guardar a data da matr\xEDcula.",code:"alunos  1 \u2500\u2500\u2500 N  matriculas  N \u2500\u2500\u2500 1  turmas"}],exercise:{kind:"choice",prompt:"Uma pessoa pode fazer v\xE1rios cursos, e cada curso pode ter v\xE1rias pessoas. Que tipo de rela\xE7\xE3o \xE9 essa?",choices:["Um para um","Um para muitos","Muitos para muitos"],answer:"Muitos para muitos",feedback:"Correto. Cada lado pode se relacionar com v\xE1rios registros do outro lado.",hint:"Conte quantos cursos uma pessoa pode fazer e quantas pessoas um curso pode ter."}},{id:"chaves",level:1,title:"Chaves: o endere\xE7o de cada registro",summary:"Use chaves prim\xE1rias e estrangeiras para encontrar e conectar linhas.",minutes:6,image:"eer",steps:[{title:"D\xEA um identificador \xFAnico",body:"A chave prim\xE1ria identifica uma linha sem confundir pessoas com o mesmo nome. \xC9 comum usar um n\xFAmero que aumenta automaticamente."},{title:"Aponte para outra tabela",body:"A chave estrangeira guarda a chave prim\xE1ria de outra tabela. Assim, uma matr\xEDcula pode indicar exatamente qual aluno e qual turma est\xE3o ligados."},{title:"Confira as siglas",body:"No editor de tabelas do Workbench, PK indica chave prim\xE1ria. FK identifica uma chave estrangeira. Essas regras ajudam a manter os v\xEDnculos corretos.",code:"alunos.id_aluno  \u2190  matriculas.id_aluno (FK)"}],exercise:{kind:"spot",prompt:"Em uma matr\xEDcula, qual campo deveria apontar para o aluno relacionado?",choices:["id_aluno (chave estrangeira)","nome_turma (texto repetido)","a cor da janela do Workbench"],answer:"id_aluno (chave estrangeira)",feedback:"Isso. A chave guarda uma refer\xEAncia confi\xE1vel ao registro do aluno.",hint:"Escolha um valor que identifique o aluno sem depender de digitar seu nome de novo."}},{id:"organizar-dados",level:1,title:"Evitar c\xF3pias e confus\xE3o",summary:"Veja como separar dados para reduzir repeti\xE7\xE3o e erros de atualiza\xE7\xE3o.",minutes:6,steps:[{title:"Perceba a repeti\xE7\xE3o",body:"Se o endere\xE7o da escola aparece em cada linha de todos os alunos, uma mudan\xE7a exige muitas corre\xE7\xF5es e pode deixar dados diferentes."},{title:"Separe o que tem vida pr\xF3pria",body:"A normaliza\xE7\xE3o \xE9 uma maneira de organizar as tabelas para reduzir repeti\xE7\xF5es e depend\xEAncias estranhas. Informa\xE7\xF5es sobre turmas ficam em \u201Cturmas\u201D; dados de alunos ficam em \u201Calunos\u201D."},{title:"Ligue as partes com chaves",body:"Separar n\xE3o significa perder a liga\xE7\xE3o. As chaves prim\xE1rias e estrangeiras permitem juntar as informa\xE7\xF5es quando precisar."}],exercise:{kind:"choice",prompt:"Se o endere\xE7o de uma turma est\xE1 repetido em todas as matr\xEDculas, qual \xE9 uma boa primeira melhoria?",choices:["Criar uma tabela \u201Cturmas\u201D e guardar o endere\xE7o nela","Apagar os nomes dos alunos","Colocar todos os dados em uma \xFAnica coluna"],answer:"Criar uma tabela \u201Cturmas\u201D e guardar o endere\xE7o nela",feedback:"Boa escolha. A informa\xE7\xE3o da turma fica em um s\xF3 lugar e as matr\xEDculas apontam para ela.",hint:"Pense em qual entidade \xE9 dona daquela informa\xE7\xE3o."}},{id:"instalar-ferramentas",level:2,title:"Conhecer as duas pe\xE7as",summary:"Prepare o MySQL Server e o MySQL Workbench para trabalharem juntos.",minutes:8,image:"install",steps:[{title:"Instale primeiro o servidor",body:"Escolha a edi\xE7\xE3o adequada ao seu sistema operacional na p\xE1gina oficial do MySQL. Durante a configura\xE7\xE3o, guarde com cuidado a senha definida para o usu\xE1rio administrador."},{title:"Instale a bancada visual",body:"Baixe o MySQL Workbench na p\xE1gina oficial. Ele pode ser instalado na mesma m\xE1quina, mas \xE9 um aplicativo diferente do Server."},{title:"Confira se o servi\xE7o est\xE1 ativo",body:"O Workbench n\xE3o substitui o servidor. Antes de abrir uma conex\xE3o, confirme que o servi\xE7o MySQL foi iniciado pelo instalador ou pelo servi\xE7o do seu sistema operacional.",note:"Os passos e telas do instalador variam entre Windows, macOS e Linux. Use a documenta\xE7\xE3o oficial para a vers\xE3o do seu sistema."}],exercise:{kind:"choice",prompt:"Qual sequ\xEAncia descreve melhor a rela\xE7\xE3o entre os aplicativos?",choices:["O Workbench envia pedidos ao MySQL Server","O MySQL Server \xE9 s\xF3 um tema do Workbench","O Workbench guarda os dados mesmo sem servidor"],answer:"O Workbench envia pedidos ao MySQL Server",feedback:"Isso: a ferramenta visual se conecta ao servidor, que executa os comandos.",hint:"Uma pe\xE7a \xE9 a interface; a outra \xE9 o servi\xE7o que responde."}},{id:"conectar-servidor",level:2,title:"Fazer a primeira conex\xE3o",summary:"Crie uma conex\xE3o local e entenda os campos de endere\xE7o e porta.",minutes:7,image:"connection",steps:[{title:"Crie uma conex\xE3o salva",body:"Na tela inicial do Workbench, use o bot\xE3o \u201C+\u201D ao lado de MySQL Connections. D\xEA um nome f\xE1cil de reconhecer, como \u201CMeu computador\u201D."},{title:"Informe para onde ligar",body:"Em uma instala\xE7\xE3o local comum, o host \xE9 127.0.0.1 e a porta padr\xE3o do MySQL \xE9 3306. O usu\xE1rio e a senha dependem do que foi configurado no seu servidor."},{title:"Teste antes de salvar",body:"Use \u201CTest Connection\u201D. Se n\xE3o funcionar, confira se o servi\xE7o est\xE1 iniciado, se a porta est\xE1 correta e se a senha foi digitada sem espa\xE7os extras.",note:"N\xE3o compartilhe senhas administrativas. Os valores mostrados aqui s\xE3o exemplos, n\xE3o credenciais universais."}],exercise:{kind:"spot",prompt:"A conex\xE3o local falhou. Qual verifica\xE7\xE3o faz mais sentido primeiro?",choices:["Ver se o servi\xE7o MySQL est\xE1 iniciado","Alterar qualquer senha at\xE9 funcionar","Apagar todas as tabelas"],answer:"Ver se o servi\xE7o MySQL est\xE1 iniciado",feedback:"Correto. Se o servi\xE7o estiver parado, a bancada n\xE3o ter\xE1 quem responda.",hint:"A conex\xE3o precisa encontrar um servidor ativo."}},{id:"criar-schema",level:3,title:"Criar seu primeiro banco",summary:"D\xEA nome a um schema e confirme que ele aparece no servidor.",minutes:6,image:"sql",steps:[{title:"Abra uma aba de consulta",body:"Ao abrir uma conex\xE3o, o Workbench mostra o editor SQL. \xC9 nessa \xE1rea que voc\xEA digita comandos para o servidor."},{title:"Crie o banco com uma frase",body:"CREATE DATABASE cria um novo banco. Use nomes claros, sem espa\xE7os, e termine cada comando com ponto e v\xEDrgula.",code:"CREATE DATABASE escola_viva;"},{title:"Selecione o banco de trabalho",body:"USE indica qual banco receber\xE1 os pr\xF3ximos comandos. Depois, atualize a lista \u201CSchemas\u201D no navegador lateral do Workbench para conferir o novo banco.",code:"USE escola_viva;"}],exercise:{kind:"fill",prompt:"Complete o nome do banco no comando:",code:"CREATE DATABASE _______;",placeholder:"Digite escola_viva",answer:"escola_viva",feedback:"Muito bem. O comando completo \xE9 CREATE DATABASE escola_viva;.",hint:"O nome \xE9 escola_viva. N\xE3o precisa repetir o comando inteiro."}},{id:"criar-tabelas",level:3,title:"Criar tabelas com prop\xF3sito",summary:"Escolha tipos de dados e regras para uma tabela de alunos.",minutes:8,steps:[{title:"Cada coluna tem um tipo",body:"INT serve para n\xFAmeros inteiros; VARCHAR(n) para texto com limite; DATE para datas. Escolher o tipo certo ajuda a validar e organizar os dados."},{title:"Declare o que \xE9 obrigat\xF3rio",body:"NOT NULL diz que um campo n\xE3o pode ficar vazio. UNIQUE impede repeti\xE7\xF5es, como dois alunos com o mesmo e-mail."},{title:"Crie uma chave prim\xE1ria",body:"AUTO_INCREMENT pede ao MySQL que gere o pr\xF3ximo n\xFAmero automaticamente. Junto com PRIMARY KEY, cada aluno recebe um identificador \xFAnico.",code:`CREATE TABLE alunos (
